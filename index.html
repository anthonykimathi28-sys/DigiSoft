<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiSoft E-Learning</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f1b3d;--mu:#5d6a85;--pr:#2f5bea;--pr2:#e9eeff;--bd:#e3e8f2;--sh:0 6px 24px rgba(20,40,90,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#151e33;--tx:#edf1fa;--mu:#9aa7c2;--pr:#7ea2ff;--pr2:#1b2a50;--bd:#26324f;--sh:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:9;padding-top:env(safe-area-inset-top,0)}
nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:4px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:21px;color:var(--pr);margin-right:auto;text-decoration:none}
nav a{color:var(--tx);text-decoration:none;padding:7px 12px;border-radius:9px;font-size:15px}nav a:hover,nav a.on{background:var(--pr2);color:var(--pr)}
main{max-width:1100px;margin:auto;padding:24px 16px 56px;min-height:70vh}
a{color:var(--pr)}.btn{display:inline-block;background:var(--pr);color:#fff;border:0;padding:10px 18px;border-radius:11px;font:600 15px inherit;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--pr2);color:var(--pr)}.btn.sm{padding:6px 13px;font-size:14px}.btn.danger{background:#fde8e8;color:#b42318}
.hero{background:linear-gradient(135deg,#2f5bea,#8b3fe0);color:#fff;border-radius:22px;padding:56px 32px;margin-bottom:30px;box-shadow:var(--sh)}
.hero h1{margin:0 0 12px;font-size:clamp(28px,5vw,44px);line-height:1.15}.hero p{max-width:560px;font-size:18px;opacity:.95}
.hero .btn{background:#fff;color:#2f5bea;margin:6px 8px 0 0}.hero .btn.alt{background:rgba(255,255,255,.2);color:#fff}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.card h3{margin:6px 0}.tag{font-size:12px;background:var(--pr2);color:var(--pr);padding:3px 10px;border-radius:99px;font-weight:700}
.mu{color:var(--mu);font-size:14px}h2{margin:30px 0 14px}.lvc{text-decoration:none;color:var(--tx)}
.lv{height:160px;border-radius:16px;display:grid;place-items:center;font-size:58px;margin-bottom:10px}.lvc b{font-size:18px}
.badge{background:#d9f5e3;color:#0b6b35;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.form{max-width:480px;margin:auto}.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;font:600 15px inherit;cursor:pointer}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.price{font-size:26px;font-weight:800}#m{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;z-index:20}
.msg{padding:12px 18px;border-radius:12px;background:var(--tx);color:var(--bg);box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ml li{margin:8px 0}.ml a{color:var(--tx);text-decoration:none}.ml a:hover{color:var(--pr)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.confirmation-card{max-width:520px;margin:80px auto;text-align:center}
.confirmation-card h2{margin-top:0}
</style>
</head>
<body>
<header><nav id="nav"></nav></header>
<main id="app"></main>
<div id="m"></div>
<footer>© 2026 DigiSoft E-Learning</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const LV={junior_secondary:"Junior Secondary",senior_secondary:"Senior Secondary",school_leaver:"School Leavers"};
const KEY={junior:"junior_secondary",senior:"senior_secondary",leavers:"school_leaver"};
const $=s=>document.querySelector(s);let S={u:null,p:null},regType="individual";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const toast=t=>{$("#m").innerHTML=`<div class="msg">${esc(t)}</div>`;setTimeout(()=>$("#m").innerHTML="",4500)};
const fd=f=>Object.fromEntries(new FormData(f));
const lvOpts=o=>Object.entries(LV).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
async function load(){const{data:{session}}=await sb.auth.getSession();S.u=session?.user||null;S.p=null;
 if(S.u){const{data}=await sb.from("profiles").select("*").eq("id",S.u.id).maybeSingle();S.p=data}}
function nav(h){const adm=S.p?.role==="admin",L=[["home","Home"],["courses","Courses"],["pricing","Pricing"]].concat(S.u?[["dashboard","My Learning"]].concat(adm?[["admin","Admin"]]:[]):[["login","Log in"],["register","Register"]]);
 $("#nav").innerHTML='<a class="logo" href="#home">🎓 DigiSoft</a>'+L.map(([k,t])=>`<a href="#${k}" class="${h===k?"on":""}">${t}</a>`).join("")+(S.u?' <a href="#" data-act="out">Log out</a>':"")}
const cc=c=>`<div class="card"><span class="tag">${LV[c.level]}</span><h3>${esc(c.title)}</h3><p class="mu">${esc(c.description||"")}</p><a class="btn sm" href="#course-${c.id}">View course</a></div>`;
const V={
home:async()=>`<section class="hero"><h1>Learn anywhere. Teach with confidence.</h1><p>Recorded lessons, notes and revision materials for Junior Secondary, Senior Secondary and school leavers.</p><a class="btn" href="#register">Start free trial</a><a class="btn alt" href="#courses">Browse courses</a></section>
<h2 style="margin-top:0">Choose your level</h2><div class="grid"><a class="lvc" href="#courses-junior"><div class="lv" style="background:linear-gradient(135deg,#34d399,#0ea5e9)">📘</div><b>Junior Secondary</b><div class="mu">Notes & worksheets</div></a><a class="lvc" href="#courses-senior"><div class="lv" style="background:linear-gradient(135deg,#f87171,#f59e0b)">📚</div><b>Senior Secondary</b><div class="mu">Revision & past papers</div></a><a class="lvc" href="#courses-leavers"><div class="lv" style="background:linear-gradient(135deg,#a78bfa,#ec4899)">🎓</div><b>School Leavers</b><div class="mu">Short courses</div></a></div>
<div class="card" style="margin-top:28px"><div class="hd"><h3 style="margin:0">Learning materials</h3><span class="badge">Free trial available</span></div><ul class="ml"><li>Download notes and revision PDFs</li><li>Watch recorded teaching sessions</li><li>Learn at your own pace, on any device</li><li><a href="#courses">Enrol in short courses →</a></li></ul></div>
<p class="mu" style="margin-top:18px">Schools and training centres: <a href="#register">register as an Organization</a>.</p>`,
async courses(f){const{data}=await sb.from("courses").select("*").eq("published",true).order("title");const l=(data||[]).filter(c=>!f||c.level===f);
 return`<h2 style="margin-top:0">Courses</h2><div class="tabs"><a class="btn alt" href="#courses">All</a>${Object.entries(KEY).map(([k,v])=>`<a class="btn alt" href="#courses-${k}">${LV[v]}</a>`).join("")}</div><div class="grid">${l.map(cc).join("")||'<p class="mu">No courses yet.</p>'}</div>`},
async course(id){const{data:c}=await sb.from("courses").select("*").eq("id",id).maybeSingle();if(!c)return"<p>Course not found.</p>";
 const act=S.u?"":'<p class="mu">Please <a href="#login">log in</a> or <a href="#register">register</a> to enrol.</p>';
 return`<div class="form" style="max-width:640px"><span class="tag">${LV[c.level]}</span><h2 style="margin:8px 0">${esc(c.title)}</h2><p>${esc(c.description||"")}</p>${act}<div class="grid"><div class="card"><h3>Free trial</h3><div class="price">KES 0</div><p class="mu">7 days, one trial per account</p><button class="btn sm" data-act="trial" data-id="${c.id}" ${S.u?"":"disabled"}>Start trial</button></div><div class="card"><h3>Subscribe</h3><div class="price">${CFG.prices.monthly}</div><p class="mu">or ${CFG.prices.termly}</p><button class="btn sm alt" data-act="pay" ${S.u?"":"disabled"}>How to pay</button></div></div><p id="pay" class="mu"></p></div>`},
pricing:async()=>`<h2 style="margin-top:0">Pricing</h2><div class="grid"><div class="card"><h3>Free Trial</h3><div class="price">KES 0</div><p class="mu">7 days on one course</p></div><div class="card"><h3>Monthly</h3><div class="price">${CFG.prices.monthly}</div><p class="mu">Per course</p></div><div class="card"><h3>Termly</h3><div class="price">${CFG.prices.termly}</div><p class="mu">Best value</p></div></div><p class="mu">Organizations: <a href="#register">register as an Organization</a> to arrange bulk access.</p>`,
register:async()=>{const o=regType=== "organization";return`<div class="form"><h2 style="margin-top:0">Create your account</h2><div class="tabs"><button data-act="rt" data-id="individual" class="${o?"":"on"}">Individual</button><button data-act="rt" data-id="organization" class="${o?"on":""}">Organization</button></div><form data-form="reg"><label>${o?"Contact person":"Full name"}</label><input name="full_name" required>${o?`<label>Organization name</label><input name="org_name" required><label>Organization type</label><select name="org_type"><option>Junior Secondary School</option><option>Senior Secondary School</option><option>Training institution</option><option>Other</option></select><label>Expected learners</label><input name="expected_learners" type="number" min="1" value="30">`: `<label>I am a</label><select name="who"><option value="learner|junior_secondary">Junior Secondary learner</option><option value="learner|senior_secondary">Senior Secondary learner</option><option value="teacher|">Teacher</option><option value="leaver|school_leaver">High school leaver</option></select>`}<label>Email</label><input name="email" type="email" required><label>Password (min 6)</label><input name="password" type="password" minlength="6" required><p><button class="btn" style="width:100%">Register</button></p></form><p class="mu">Have an account? <a href="#login">Log in</a></p></div>`},
login:async()=>`<div class="form"><h2 style="margin-top:0">Log in</h2><form data-form="login"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><p><button class="btn" style="width:100%">Log in</button></p></form><p class="mu"><a href="#" data-act="reset">Forgot password?</a> · <a href="#register">Create account</a></p></div>`,
async dashboard(){if(!S.u)return V.login();const[{data:en},{data:ms}]=await Promise.all([sb.from("enrollments").select("*,courses(title,level)").order("ends_at",{ascending:false}),sb.from("materials").select("*").order("position")]);const now=Date.now();let h=`<h2 style="margin-top:0">Welcome, ${esc(S.p?.full_name||"")}</h2><p class="mu">${S.p?.account_type=== "organization"?"Organization account":"Individual account"}</p>`;if(!(en||[]).length)return h+'<div class="card"><p>You have not enrolled yet.</p><a class="btn" href="#courses">Find a course</a></div>';return h+en.map(e=>{const live=e.status=== "active"&&new Date(e.ends_at)>now,list=(ms||[]).filter(m=>m.course_id===e.course_id);return`<div class="card" style="margin-bottom:16px"><div class="hd"><h3 style="margin:0">${esc(e.courses.title)}</h3><span class="badge">${e.plan} · ${live?"until "+new Date(e.ends_at).toLocaleDateString():"expired"}</span></div>${live?(list.map(m=>`<div class="row"><span>${m.kind=== "video"?"🎬":"📄"} ${esc(m.title)}</span>${m.kind=== "video"?`<a class="btn sm alt" href="${esc(m.video_url)}" target="_blank" rel="noopener noreferrer">Watch</a>`:`<button class="btn sm alt" data-act="dl" data-id="${esc(m.file_path)}">Download</button>`}</div>`).join("")||'<p class="mu">Materials coming soon.</p>'): '<p class="mu">Access ended. <a href="#course-'+e.course_id+'">Renew</a></p>'}</div>`}).join("")},
async admin(){if(S.p?.role!=== "admin")return"<p>Admins only.</p>";const[{data:cs},{data:ps},{data:os}]=await Promise.all([sb.from("courses").select("*").order("title"),sb.from("profiles").select("id,full_name,role").order("full_name"),sb.from("organizations").select("*").order("created_at",{ascending:false})]);const co=(cs||[]).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("");return`<h2 style="margin-top:0">Admin</h2><div class="two"><div class="card"><h3>Add course</h3><form data-form="course"><label>Title</label><input name="title" required><label>Level</label><select name="level">${lvOpts()}</select><label>Description</label><textarea name="description" rows="2"></textarea><label><input type="checkbox" name="published" style="width:auto"> Publish now</label><p><button class="btn">Save course</button></p></form></div><div class="card"><h3>Add material</h3><form data-form="mat"><label>Course</label><select name="course_id">${co}</select><label>Title</label><input name="title" required><label>Type</label><select name="kind"><option value="document">Document (upload)</option><option value="video">Video (link)</option></select><label>File (documents)</label><input type="file" name="file"><label>Video link (Vimeo/YouTube unlisted)</label><input name="video_url" type="url"><p><button class="btn">Add material</button></p></form></div><div class="card"><h3>Grant access</h3><form data-form="grant"><label>User</label><select name="user_id">${(ps||[]).map(p=>`<option value="${p.id}">${esc(p.full_name)} (${p.role})</option>`).join("")}</select><label>Course</label><select name="course_id">${co}</select><label>Plan</label><select name="plan"><option value="monthly">Monthly (30 days)</option><option value="termly">Termly (90 days)</option></select><p><button class="btn">Activate</button></p></form></div><div class="card"><h3>Organizations</h3>${(os||[]).map(o=>`<div class="row"><span>${esc(o.name)} <span class="tag">${o.status}</span></span>${o.status!=== "approved"?`<button class="btn sm" data-act="appr" data-id="${o.id}">Approve</button>`:""}</div>`).join("")||'<p class="mu">None yet.</p>'}</div></div><div class="card" style="margin-top:18px"><h3>Courses</h3>${(cs||[]).map(c=>`<div class="row"><span>${esc(c.title)} <span class="tag">${c.published?"published":"draft"}</span></span><button class="btn sm alt" data-act="pub" data-id="${c.id}" data-v="${c.published}">${c.published?"Unpublish":"Publish"}</button></div>`).join("")}</div>`}};
async function render(){let h=location.hash.slice(1)||"home",a=null;if(h.startsWith("courses-")){a=KEY[h.slice(8)];h="courses"}else if(h.startsWith("course-")){a=h.slice(7);h="course"}nav(h);$("#app").innerHTML='<p class="mu">Loading…</p>';try{$("#app").innerHTML=await(V[h]||V.home)(a)}catch(e){$("#app").innerHTML="<p>Something went wrong. Check config.js.</p>"}window.scrollTo(0,0)}
const done=async(p,t)=>{const{error}=await p;if(error)toast(error.message);else{if(t)toast(t);render()}};
document.addEventListener("submit",async e=>{const f=e.target,k=f.dataset.form;if(!k)return;e.preventDefault();const d=fd(f);
 if(k=== "login"){const{error}=await sb.auth.signInWithPassword(d);if(error)return toast(error.message);await load();location.hash="dashboard";render()}
 if(k=== "reg"){const[role,level]=(d.who||"|").split("|"),o=regType=== "organization";const{data,error}=await sb.auth.signUp({email:d.email,password:d.password,options:{emailRedirectTo:`${location.origin}${location.pathname}#confirmed`,data:{full_name:d.full_name,account_type:regType,role:o?"":role,level:o?"":level,org_name:d.org_name,org_type:d.org_type,expected_learners:d.expected_learners}}});if(error)return toast(error.message);if(!data.session){$("#app").innerHTML=`<div class="card confirmation-card"><h2>Check your email</h2><p>We sent a confirmation link to <strong>${esc(d.email)}</strong>.</p><p class="mu">Open the link to confirm your account, then you will return to DigiSoft automatically.</p><a class="btn" href="#login">Back to log in</a></div>`;return}await load();location.hash="dashboard";render()}
 if(k=== "course")done(sb.from("courses").insert({title:d.title,slug:d.title.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString(36),level:d.level,description:d.description,published:!!d.published}),"Course saved");
 if(k=== "mat"){let path=null;const file=f.file.files[0];if(d.kind=== "document"){if(!file)return toast("Choose a file");path=`${d.course_id}/${file.name}`;const{error}=await sb.storage.from("materials").upload(path,file,{upsert:true});if(error)return toast(error.message)}done(sb.from("materials").insert({course_id:d.course_id,title:d.title,kind:d.kind,file_path:path,video_url:d.video_url||null}),"Material added")}
 if(k=== "grant")done(sb.from("enrollments").upsert({user_id:d.user_id,course_id:d.course_id,plan:d.plan,status:"active",starts_at:new Date().toISOString(),ends_at:new Date(Date.now()+(d.plan=== "termly"?90:30)*864e5).toISOString()},{onConflict:"user_id,course_id"}),"Access activated")});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(b.tagName=== "A")e.preventDefault();if(a=== "out"){await sb.auth.signOut();await load();location.hash="home";render()}if(a=== "rt") {regType=id;render()}if(a=== "trial")done(sb.from("enrollments").insert({user_id:S.u.id,course_id:id,plan:"trial",ends_at:new Date(Date.now()+7*864e5).toISOString()}).then(r=>{if(!r.error)location.hash="dashboard";else if(r.error.code=== "23505")r.error.message="You have already used your free trial or enrolled in this course.";return r}),"Trial started");if(a=== "pay")$("#pay").textContent=CFG.payInfo;if(a=== "dl") {const{data,error}=await sb.storage.from("materials").createSignedUrl(id,60,{download:true});if(error)return toast(error.message);location.href=data.signedUrl}if(a=== "appr")done(sb.from("organizations").update({status:"approved"}).eq("id",id),"Approved");if(a=== "pub")done(sb.from("courses").update({published:b.dataset.v!=== "true"}).eq("id",id));if(a=== "reset") {const em=prompt("Your email:");if(em)done(sb.auth.resetPasswordForEmail(em,{redirectTo:`${location.origin}${location.pathname}#login`}),"Reset link sent")}});
window.addEventListener("hashchange",render);
sb.auth.onAuthStateChange(async(event,session)=>{if(event=== "SIGNED_IN"&&session?.user){await load();if(location.hash=== "#confirmed"||location.hash=== ""){location.hash="dashboard";await render();toast("Email confirmed — welcome to DigiSoft!")}else await render()}else if(event=== "SIGNED_OUT"){await load();await render()}});
async function initialize(){const params=new URLSearchParams(location.search);const hashParams=new URLSearchParams(location.hash.startsWith("#")?location.hash.slice(1):location.hash);const authError=params.get("error_description")||hashParams.get("error_description");if(authError){toast(authError.replace(/\+/g," "));return render()}await load();if(location.hash=== "#confirmed"&&S.u){location.hash="dashboard";await render();toast("Email confirmed — welcome to DigiSoft!")}else await render()}
initialize();
</script>
</body>
</html>
