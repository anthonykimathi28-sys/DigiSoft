<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>DigiSoft E-Learning</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f1b3d;--mu:#5d6a85;--pr:#2f5bea;--pr2:#e9eeff;--bd:#e3e8f2;--sh:0 6px 24px rgba(20,40,90,.08)}@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#151e33;--tx:#edf1fa;--mu:#9aa7c2;--pr:#7ea2ff;--pr2:#1b2a50;--bd:#26324f;--sh:none}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:9;padding-top:env(safe-area-inset-top,0)}nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:4px;padding:10px 16px;flex-wrap:wrap}.logo{font-weight:800;font-size:21px;color:var(--pr);margin-right:auto;text-decoration:none}nav a{color:var(--tx);text-decoration:none;padding:7px 12px;border-radius:9px;font-size:15px}nav a:hover,nav a.on{background:var(--pr2);color:var(--pr)}main{max-width:1100px;margin:auto;padding:24px 16px 56px;min-height:70vh}a{color:var(--pr)}.btn{display:inline-block;background:var(--pr);color:#fff;border:0;padding:10px 18px;border-radius:11px;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;text-decoration:none}.btn.alt{background:var(--pr2);color:var(--pr)}.btn.sm{padding:6px 13px;font-size:14px}.btn:disabled{opacity:.55;cursor:not-allowed}.hero{background:linear-gradient(135deg,#2f5bea,#8b3fe0);color:#fff;border-radius:22px;padding:clamp(28px,6vw,56px) 32px;margin-bottom:30px;box-shadow:var(--sh)}.hero h1{margin:0 0 12px;font-size:clamp(28px,5vw,44px);line-height:1.15}.hero p{max-width:560px;font-size:18px;opacity:.95}.hero .btn{background:#fff;color:#2f5bea;margin:6px 8px 0 0}.hero .btn.alt{background:rgba(255,255,255,.2);color:#fff}.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh)}.card h3{margin:6px 0}.tag{font-size:12px;background:var(--pr2);color:var(--pr);padding:3px 10px;border-radius:99px;font-weight:700}.mu{color:var(--mu);font-size:14px}h2{margin:30px 0 14px}.lvc{text-decoration:none;color:var(--tx)}.lv{height:160px;border-radius:16px;display:grid;place-items:center;font-size:58px;margin-bottom:10px}.lvc b{font-size:18px}.badge{background:#d9f5e3;color:#0b6b35;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px}.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.form{max-width:480px;margin:auto}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}.price{font-size:26px;font-weight:800}#m{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;z-index:20}.msg{padding:12px 18px;border-radius:12px;background:var(--tx);color:var(--bg);box-shadow:var(--sh)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.ml li{margin:8px 0}.ml a{color:var(--tx);text-decoration:none}.ml a:hover{color:var(--pr)}footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}.confirmation-card{max-width:520px;margin:60px auto;text-align:center}.confirmation-card h2{margin-top:0}
</style>
</head>
<body>
<header><nav id="nav" aria-label="Main navigation"></nav></header><main id="app" aria-live="polite"><p class="mu">Loading DigiSoft…</p></main><div id="m" role="status" aria-live="polite"></div><footer>© 2026 DigiSoft E-Learning</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const LV={junior_secondary:'Junior Secondary',senior_secondary:'Senior Secondary',school_leaver:'School Leavers'},KEY={junior:'junior_secondary',senior:'senior_secondary',leavers:'school_leaver'};
const S={u:null,p:null,registerType:'individual',rendering:false,pendingRender:false};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(text){const node=$('#m');node.innerHTML='<div class="msg">'+esc(text)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.textContent='',5000)}
if(!window.supabase||!window.CFG||!CFG.url||!CFG.key){app.innerHTML='<section class="card"><h1>DigiSoft is temporarily unavailable</h1><p>Supabase configuration is missing. Check config.js.</p></section>';return}
const sb=window.supabase.createClient(CFG.url,CFG.key);
async function load(){const{data,error}=await sb.auth.getSession();if(error)throw error;S.u=data.session?.user||null;S.p=null;if(S.u){const result=await sb.from('profiles').select('*').eq('id',S.u.id).maybeSingle();if(result.error)console.warn('Profile lookup:',result.error.message);S.p=result.data||null}}
function nav(route){const links=[['home','Home'],['courses','Courses'],['pricing','Pricing']];if(S.u){links.push(['dashboard','My Learning']);if(S.p?.role==='admin')links.push(['admin','Admin'])}else links.push(['login','Log in'],['register','Register']);$('#nav').innerHTML='<a class="logo" href="#home">🎓 DigiSoft</a>'+links.map(([k,t])=>'<a href="#'+k+'" class="'+(route===k?'on':'')+'">'+t+'</a>').join('')+(S.u?'<a href="#" data-act="out">Log out</a>':'')}
const courseCard=c=>'<article class="card"><span class="tag">'+esc(LV[c.level]||c.level||'Course')+'</span><h3>'+esc(c.title)+'</h3><p class="mu">'+esc(c.description||'')+'</p><a class="btn sm" href="#course-'+encodeURIComponent(c.id)+'">View course</a></article>';
function home(){return '<section class="hero"><h1>Learn anywhere. Teach with confidence.</h1><p>Recorded lessons, notes and revision materials for Junior Secondary, Senior Secondary and school leavers.</p><a class="btn" href="#register">Create an account</a><a class="btn alt" href="#courses">Browse courses</a></section><h2 style="margin-top:0">Choose your level</h2><div class="grid"><a class="lvc" href="#courses-junior"><div class="lv" style="background:linear-gradient(135deg,#34d399,#0ea5e9)">📘</div><b>Junior Secondary</b><div class="mu">Notes &amp; worksheets</div></a><a class="lvc" href="#courses-senior"><div class="lv" style="background:linear-gradient(135deg,#f87171,#f59e0b)">📚</div><b>Senior Secondary</b><div class="mu">Revision &amp; past papers</div></a><a class="lvc" href="#courses-leavers"><div class="lv" style="background:linear-gradient(135deg,#a78bfa,#ec4899)">🎓</div><b>School Leavers</b><div class="mu">Short courses</div></a></div><section class="card" style="margin-top:28px"><h3>Learning materials</h3><ul><li>Download notes and revision PDFs</li><li>Watch recorded teaching sessions</li><li>Learn at your own pace, on any device</li></ul></section><p class="mu">Schools and training centres: <a href="#register" data-register-type="organization">register as an Organization</a>.</p>'}
async function courses(level){const{data,error}=await sb.from('courses').select('*').eq('published',true).order('title');if(error)throw error;const list=(data||[]).filter(c=>!level||c.level===level);return '<h2 style="margin-top:0">Courses</h2><div class="tabs"><a class="btn alt" href="#courses">All</a>'+Object.entries(KEY).map(([k,v])=>'<a class="btn alt" href="#courses-'+k+'">'+esc(LV[v])+'</a>').join('')+'</div><div class="grid">'+(list.map(courseCard).join('')||'<p class="mu">No courses available yet.</p>')+'</div>'}
async function coursePage(id){const{data:c,error}=await sb.from('courses').select('*').eq('id',id).maybeSingle();if(error)throw error;if(!c)return '<p>Course not found.</p>';const disabled=S.u?'':'disabled';return '<div class="form" style="max-width:640px"><span class="tag">'+esc(LV[c.level]||c.level||'Course')+'</span><h2 style="margin:8px 0">'+esc(c.title)+'</h2><p>'+esc(c.description||'')+'</p>'+(S.u?'':'<p class="mu">Please <a href="#login">log in</a> or <a href="#register">create an account</a> to enrol.</p>')+'<div class="grid"><article class="card"><h3>Free trial</h3><div class="price">KES 0</div><p class="mu">7 days, one trial per account</p><button class="btn sm" data-act="trial" data-id="'+esc(c.id)+'" '+disabled+'>Start trial</button></article><article class="card"><h3>Subscribe</h3><div class="price">'+esc(CFG.prices.monthly)+'</div><p class="mu">or '+esc(CFG.prices.termly)+'</p><button class="btn sm alt" data-act="pay" '+disabled+'>How to pay</button></article></div><p id="pay" class="mu"></p></div>'}
function registerPage(){const org=S.registerType==='organization';return '<div class="form"><h2 style="margin-top:0">Create your account</h2><div class="tabs"><button type="button" data-act="rt" data-id="individual" class="'+(org?'':'on')+'">Individual</button><button type="button" data-act="rt" data-id="organization" class="'+(org?'on':'')+'">Organization</button></div><form data-form="reg"><label for="full_name">'+(org?'Contact person':'Full name')+'</label><input id="full_name" name="full_name" autocomplete="name" required>'+(org?'<label for="org_name">Organization name</label><input id="org_name" name="org_name" required><label for="org_type">Organization type</label><select id="org_type" name="org_type"><option>Junior Secondary School</option><option>Senior Secondary School</option><option>Training institution</option><option>Other</option></select><label for="expected_learners">Expected learners</label><input id="expected_learners" name="expected_learners" type="number" min="1" value="30">':'<label for="who">I am a</label><select id="who" name="who"><option value="learner|junior_secondary">Junior Secondary learner</option><option value="learner|senior_secondary">Senior Secondary learner</option><option value="teacher|">Teacher</option><option value="leaver|school_leaver">High school leaver</option></select>')+'<label for="reg-email">Email</label><input id="reg-email" name="email" type="email" autocomplete="email" required><label for="reg-password">Password (minimum 6 characters)</label><input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="6" required><p><button class="btn" style="width:100%" type="submit">Create account</button></p></form><p class="mu">Already have an account? <a href="#login">Log in</a></p></div>'}
function loginPage(){return '<div class="form"><h2 style="margin-top:0">Log in</h2><form data-form="login"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="email" required><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><p><button class="btn" style="width:100%">Log in</button></p></form><p class="mu"><a href="#" data-act="reset">Forgot password?</a> · <a href="#register">Create account</a></p></div>'}
async function dashboard(){if(!S.u)return loginPage();const[{data:en,error:e1},{data:ms,error:e2}]=await Promise.all([sb.from('enrollments').select('*,courses(title,level)').order('ends_at',{ascending:false}),sb.from('materials').select('*').order('position')]);if(e1)throw e1;if(e2)throw e2;let html='<h2 style="margin-top:0">Welcome, '+esc(S.p?.full_name||S.u.email||'Learner')+'</h2><p class="mu">'+(S.p?.account_type==='organization'?'Organization account':'Individual account')+'</p>';if(!en?.length)return html+'<section class="card"><p>You have not enrolled yet.</p><a class="btn" href="#courses">Find a course</a></section>';return html+en.map(e=>{const active=e.status==='active'&&new Date(e.ends_at)>new Date(),items=(ms||[]).filter(m=>m.course_id===e.course_id);const resources=active?(items.map(m=>'<div class="row"><span>'+(m.kind==='video'?'🎬':'📄')+' '+esc(m.title)+'</span>'+(m.kind==='video'?'<a class="btn sm alt" href="'+esc(m.video_url)+'" target="_blank" rel="noopener noreferrer">Watch</a>':'<button class="btn sm alt" data-act="dl" data-id="'+esc(m.file_path)+'">Download</button>')+'</div>').join('')||'<p class="mu">Materials coming soon.</p>'):'<p class="mu">Access ended. <a href="#course-'+encodeURIComponent(e.course_id)+'">Renew</a></p>';return '<section class="card" style="margin-bottom:16px"><div class="hd"><h3>'+esc(e.courses?.title||'Course')+'</h3><span class="badge">'+esc(e.plan)+' · '+(active?'until '+new Date(e.ends_at).toLocaleDateString():'expired')+'</span></div>'+resources+'</section>'}).join('')}
async function adminPage(){if(S.p?.role!=='admin')return '<p>Admins only.</p>';const[{data:cs,error:e1},{data:ps,error:e2},{data:os,error:e3}]=await Promise.all([sb.from('courses').select('*').order('title'),sb.from('profiles').select('id,full_name,role').order('full_name'),sb.from('organizations').select('*').order('created_at',{ascending:false})]);if(e1||e2||e3)throw e1||e2||e3;const options=(cs||[]).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.title)+'</option>').join('');return '<h2 style="margin-top:0">Admin</h2><div class="two"><section class="card"><h3>Add course</h3><form data-form="course"><label>Title</label><input name="title" required><label>Level</label><select name="level">'+Object.entries(LV).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select><label>Description</label><textarea name="description" rows="2"></textarea><label><input type="checkbox" name="published" style="width:auto"> Publish now</label><p><button class="btn">Save course</button></p></form></section><section class="card"><h3>Add material</h3><form data-form="mat"><label>Course</label><select name="course_id" required>'+options+'</select><label>Title</label><input name="title" required><label>Type</label><select name="kind"><option value="document">Document (upload)</option><option value="video">Video (link)</option></select><label>File (documents)</label><input type="file" name="file"><label>Video link</label><input name="video_url" type="url"><p><button class="btn">Add material</button></p></form></section><section class="card"><h3>Grant access</h3><form data-form="grant"><label>User</label><select name="user_id" required>'+ (ps||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.full_name||'User')+' ('+esc(p.role||'learner')+')</option>').join('')+'</select><label>Course</label><select name="course_id" required>'+options+'</select><label>Plan</label><select name="plan"><option value="monthly">Monthly (30 days)</option><option value="termly">Termly (90 days)</option></select><p><button class="btn">Activate</button></p></form></section><section class="card"><h3>Organizations</h3>'+((os||[]).map(o=>'<div class="row"><span>'+esc(o.name)+' <span class="tag">'+esc(o.status)+'</span></span>'+(o.status!=='approved'?'<button class="btn sm" data-act="appr" data-id="'+esc(o.id)+'">Approve</button>':'')+'</div>').join('')||'<p class="mu">None yet.</p>')+'</section></div><section class="card" style="margin-top:18px"><h3>Courses</h3>'+((cs||[]).map(c=>'<div class="row"><span>'+esc(c.title)+' <span class="tag">'+(c.published?'published':'draft')+'</span></span><button class="btn sm alt" data-act="pub" data-id="'+esc(c.id)+'" data-v="'+String(c.published)+'">'+(c.published?'Unpublish':'Publish')+'</button></div>').join('')||'<p class="mu">No courses yet.</p>')+'</section>'}
async function render(){if(S.rendering){S.pendingRender=true;return}S.rendering=true;try{const raw=decodeURIComponent(location.hash.slice(1)||'home');let route=raw,arg=null;if(raw.startsWith('courses-')){arg=KEY[raw.slice(8)]||null;route='courses'}else if(raw.startsWith('course-')){arg=raw.slice(7);route='course'}nav(route);app.innerHTML='<p class="mu">Loading…</p>';let html;if(route==='home')html=home();else if(route==='courses')html=await courses(arg);else if(route==='course')html=await coursePage(arg);else if(route==='pricing')html='<h2 style="margin-top:0">Pricing</h2><div class="grid"><section class="card"><h3>Free trial</h3><div class="price">KES 0</div><p class="mu">7 days on one course</p></section><section class="card"><h3>Monthly</h3><div class="price">'+esc(CFG.prices.monthly)+'</div><p class="mu">Per course</p></section><section class="card"><h3>Termly</h3><div class="price">'+esc(CFG.prices.termly)+'</div><p class="mu">Best value</p></section></div><p class="mu">Organizations: <a href="#register" data-register-type="organization">register as an Organization</a> to arrange bulk access.</p>';else if(route==='register')html=registerPage();else if(route==='login')html=loginPage();else if(route==='dashboard')html=await dashboard();else if(route==='admin')html=await adminPage();else html=home();app.innerHTML=html;window.scrollTo(0,0)}catch(error){console.error('DigiSoft rendering error:',error);app.innerHTML='<section class="card"><h2>Unable to load this page</h2><p>'+esc(error.message||'Please try again.')+'</p><button class="btn" data-act="retry">Try again</button></section>'}finally{S.rendering=false;if(S.pendingRender){S.pendingRender=false;queueMicrotask(render)}}}
function formData(form){return Object.fromEntries(new FormData(form))}
document.addEventListener('submit',async event=>{const form=event.target,kind=form.dataset.form;if(!kind)return;event.preventDefault();const d=formData(form),button=form.querySelector('button[type="submit"],button:not([type])');if(button)button.disabled=true;try{if(kind==='reg'){const[role,level]=(d.who||'|').split('|'),org=S.registerType==='organization',redirect=`${location.origin}${location.pathname}#confirmed`;const{data,error}=await sb.auth.signUp({email:d.email.trim(),password:d.password,options:{emailRedirectTo:redirect,data:{full_name:d.full_name.trim(),account_type:S.registerType,role:org?'':role,level:org?'':level,org_name:d.org_name||'',org_type:d.org_type||'',expected_learners:d.expected_learners||''}}});if(error)throw error;if(!data.session){app.innerHTML='<section class="card confirmation-card"><h2>Check your email</h2><p>We sent a confirmation link to <strong>'+esc(d.email)+'</strong>.</p><p class="mu">Open the link to confirm your email and activate your account. You will return to DigiSoft; then log in.</p><a class="btn" href="#login">Back to log in</a></section>';return}await load();location.hash='dashboard';await render();toast('Your account was created successfully.')}else if(kind==='login'){const{error}=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.password});if(error)throw error;await load();location.hash='dashboard';await render()}else if(kind==='course'){const title=d.title.trim(),{error}=await sb.from('courses').insert({title,slug:title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36),level:d.level,description:d.description,published:!!d.published});if(error)throw error;toast('Course saved.');await render()}else if(kind==='mat'){let path=null;if(d.kind==='document'){const file=form.elements.file.files[0];if(!file)throw new Error('Choose a file to upload.');path=d.course_id+'/'+file.name;const{error}=await sb.storage.from('materials').upload(path,file,{upsert:true});if(error)throw error}const{error}=await sb.from('materials').insert({course_id:d.course_id,title:d.title.trim(),kind:d.kind,file_path:path,video_url:d.video_url||null});if(error)throw error;toast('Material added.');await render()}else if(kind==='grant'){const now=new Date(),end=new Date(now.getTime()+(d.plan==='termly'?90:30)*86400000),{error}=await sb.from('enrollments').upsert({user_id:d.user_id,course_id:d.course_id,plan:d.plan,status:'active',starts_at:now.toISOString(),ends_at:end.toISOString()},{onConflict:'user_id,course_id'});if(error)throw error;toast('Access activated.');await render()}}catch(error){console.error('DigiSoft form error:',error);toast(error.message||'Something went wrong. Please try again.')}finally{if(button?.isConnected)button.disabled=false}});
document.addEventListener('click',async event=>{const typeLink=event.target.closest('[data-register-type]');if(typeLink)S.registerType=typeLink.dataset.registerType;const b=event.target.closest('[data-act]');if(!b)return;const action=b.dataset.act,id=b.dataset.id;if(b.tagName==='A')event.preventDefault();try{if(action==='rt'){S.registerType=id;await render()}else if(action==='retry'){await load();await render()}else if(action==='out'){const{error}=await sb.auth.signOut();if(error)throw error;S.u=null;S.p=null;location.hash='home';await render()}else if(action==='trial'){if(!S.u){location.hash='login';return}const{error}=await sb.from('enrollments').insert({user_id:S.u.id,course_id:id,plan:'trial',status:'active',starts_at:new Date().toISOString(),ends_at:new Date(Date.now()+7*86400000).toISOString()});if(error)throw error;location.hash='dashboard';await render();toast('Your free trial has started.')}else if(action==='pay')$('#pay').textContent=CFG.payInfo;else if(action==='dl'){const{data,error}=await sb.storage.from('materials').createSignedUrl(id,60,{download:true});if(error)throw error;location.assign(data.signedUrl)}else if(action==='appr'){const{error}=await sb.from('organizations').update({status:'approved'}).eq('id',id);if(error)throw error;await render()}else if(action==='pub'){const{error}=await sb.from('courses').update({published:b.dataset.v!=='true'}).eq('id',id);if(error)throw error;await render()}else if(action==='reset'){const email=prompt('Enter your account email:');if(email){const{error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:`${location.origin}${location.pathname}#login`});if(error)throw error;toast('Password reset link sent. Check your email.')}}}catch(error){console.error('DigiSoft action error:',error);toast(error.message||'Action failed. Please try again.')}});
window.addEventListener('hashchange',render);
sb.auth.onAuthStateChange((event,session)=>{if(['SIGNED_IN','SIGNED_OUT','USER_UPDATED','PASSWORD_RECOVERY'].includes(event)){Promise.resolve().then(async()=>{S.u=session?.user||null;await load();if(location.hash==='#confirmed'&&S.u){location.hash='dashboard';toast('Email confirmed — your account is ready.')}await render()}).catch(error=>{console.error('Auth state error:',error);toast(error.message||'Could not refresh account state.')})}});
async function initialize(){const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash),authError=query.get('error_description')||hash.get('error_description');if(authError)toast(authError.replace(/\+/g,' '));await load();if(location.hash==='#confirmed'&&S.u){location.hash='dashboard';toast('Email confirmed — your account is ready.')}await render()}
initialize().catch(error=>{console.error('DigiSoft startup error:',error);app.innerHTML='<section class="card"><h2>Unable to start DigiSoft</h2><p>'+esc(error.message||'Check your internet connection and configuration, then reload.')+'</p><button class="btn" data-act="retry">Try again</button></section>'});
})();
</script>
